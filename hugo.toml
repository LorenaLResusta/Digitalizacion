baseURL = "https://lorenalresusta.github.io/Digitalizacion/"
defaultContentLanguage = "es"
locale = "es-ES"
title = "Digitalización aplicada a los sectores productivos"
theme = "hugo-theme-relearn"

[params]
  themeVariant = ["auto", "relearn-light", "relearn-dark"]
  collapsibleMenu = true
  alwaysopen = false
  showVisitedLinks = true
  disableLandingPageButton = true
  disableGeneratorVersion = true
  editURL = "https://github.com/LorenaLResusta/Digitalizacion/edit/main/content/${FilePath}"
  author.name = "Lorena L. Resusta"

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
